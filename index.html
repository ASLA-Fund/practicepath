<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path to Practice: Studio. Practice. License.</title>
<meta name="description" content="Everything you need to navigate your journey from classroom to career and licensure, all in one place. A LABash resource.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1F3EE}
a{color:#0E2219}a:hover{color:#3D4F45}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #0E2219;outline-offset:3px}
@media (max-width: 820px){
  .pp-hero-topo{display:none !important}
  .pp-h1{font-size:48px !important}
  .pp-section{padding-left:20px !important;padding-right:20px !important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F1F3EE; color: #0E2219; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.55">

<header class="pp-section" style="padding: 20px 64px; border-bottom: 1px solid #D3DAD3">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0E2219">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#0E2219" stroke-width="1.75"></circle><path d="M5 21 C11 13, 17 25, 29 12" fill="none" stroke="#0E2219" stroke-width="1.75" stroke-linecap="round"></path><circle cx="29" cy="12" r="3.5" fill="#C8F04A" stroke="#0E2219" stroke-width="1.5"></circle></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">path to practice</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 28px; font-size: 15px; font-weight: 500">
<a href="#path" style="text-decoration: none">The path</a>
<a href="#needs" style="text-decoration: none">All resources</a>
<a href="#deadlines" style="text-decoration: none">Deadlines</a>
<a href="#labash" style="text-decoration: none">LABash</a>
<a href="#about" style="text-decoration: none">About</a>
</nav>
</div>
</header>

<section id="top" class="pp-section" style="position: relative; overflow: hidden; padding: 88px 64px 64px">
<svg class="pp-hero-topo" width="620" height="520" viewBox="0 0 620 520" aria-hidden="true" style="position: absolute; right: -60px; top: -40px">
<g fill="none" stroke="#C9D2C9" stroke-width="1.25">
<path d="M80 300 C120 160 300 90 430 140 C560 190 600 330 500 410 C400 490 160 470 100 390 C70 350 72 320 80 300 Z"></path>
<path d="M140 300 C170 200 300 150 410 185 C520 220 545 320 470 380 C395 440 210 425 160 365 C140 340 135 318 140 300 Z"></path>
<path d="M200 300 C220 235 310 205 390 228 C470 252 488 315 440 352 C392 390 262 380 225 342 C210 327 196 314 200 300 Z"></path>
<path d="M258 298 C272 262 322 247 368 262 C414 278 420 312 396 330 C372 349 300 344 278 324 C266 314 254 306 258 298 Z"></path>
<path d="M20 230 C90 60 330 -10 500 50 C640 100 660 250 600 360"></path>
<path d="M0 160 C80 10 300 -50 470 -10"></path>
</g>
<circle cx="330" cy="296" r="9" fill="#C8F04A" stroke="#0E2219" stroke-width="2"></circle>
</svg>
<div style="position: relative; max-width: 1240px; margin: 0 auto">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #3D4F45">A LABash resource</div>
<h1 class="pp-h1" style="margin: 18px 0 0; max-width: 820px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 76px; line-height: 1.0; letter-spacing: -0.035em">Path to Practice</h1>
<div style="margin-top: 14px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; color: #3D4F45">Studio. Practice. License.</div>
<p style="margin: 24px 0 0; max-width: 600px; font-size: 20px; line-height: 1.5; color: #3D4F45">Everything you need to navigate your journey from classroom to career and licensure, all in one place.</p>
<div style="margin-top: 44px">
<div id="where-label" style="font-weight: 600; font-size: 15px; margin-bottom: 12px">Where are you right now?</div>
<div role="group" aria-labelledby="where-label" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="6">
<button type="button" onClick="{{s.select}}" aria-pressed="{{s.pressed}}" style="{{s.chipStyle}}">{{s.chip}}</button>
</sc-for>
</div>
</div>
<div style="margin-top: 40px; display: flex; flex-wrap: wrap; gap: 8px 32px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #3D4F45">
<span>60 resources</span><span>6 organizations</span><span>One place. Every step.</span>
</div>
</div>
</section>

<section id="path" class="pp-section" style="padding: 24px 64px 88px">
<div style="max-width: 1240px; margin: 0 auto">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.02em">The path</h2>
<p style="margin: 8px 0 0; color: #3D4F45">Six stops from your first studio to your license. Pick one to see what to do and where to go.</p>

<div style="margin-top: 40px; overflow-x: auto; padding-bottom: 8px">
<div style="position: relative; min-width: 940px; padding-top: 28px">
<span style="position: absolute; left: 0; top: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #3D4F45">Trailhead: first studio</span>
<div style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="6">
<div style="position: relative; min-height: 290px">
<sc-if value="{{s.first}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 50%; height: 200px; overflow: visible"><path d="M0 62 L100 62" fill="none" stroke="#C3CDC3" stroke-width="48" vector-effect="non-scaling-stroke"></path><path d="M0 62 L100 62" fill="none" stroke="#E4E9E1" stroke-width="40" vector-effect="non-scaling-stroke"></path><path d="M0 62 L100 62" fill="none" stroke="#C8F04A" stroke-width="12" vector-effect="non-scaling-stroke"></path><path d="M0 62 L100 62" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></sc-if>
<sc-if value="{{s.down}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: calc(100% + 12px); height: 200px; overflow: visible"><path d="M0 62 C50 62 50 142 100 142" fill="none" stroke="#C3CDC3" stroke-width="48" vector-effect="non-scaling-stroke"></path><path d="M0 62 C50 62 50 142 100 142" fill="none" stroke="#E4E9E1" stroke-width="40" vector-effect="non-scaling-stroke"></path><path d="M0 62 C50 62 50 142 100 142" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></sc-if>
<sc-if value="{{s.up}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: calc(100% + 12px); height: 200px; overflow: visible"><path d="M0 142 C50 142 50 62 100 62" fill="none" stroke="#C3CDC3" stroke-width="48" vector-effect="non-scaling-stroke"></path><path d="M0 142 C50 142 50 62 100 62" fill="none" stroke="#E4E9E1" stroke-width="40" vector-effect="non-scaling-stroke"></path><path d="M0 142 C50 142 50 62 100 62" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></sc-if>
<div style="{{s.downWalkedStyle}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: calc(100% + 12px); height: 200px; overflow: visible"><path d="M0 62 C50 62 50 142 100 142" fill="none" stroke="#C8F04A" stroke-width="12" vector-effect="non-scaling-stroke"></path><path d="M0 62 C50 62 50 142 100 142" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></div>
<div style="{{s.upWalkedStyle}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: calc(100% + 12px); height: 200px; overflow: visible"><path d="M0 142 C50 142 50 62 100 62" fill="none" stroke="#C8F04A" stroke-width="12" vector-effect="non-scaling-stroke"></path><path d="M0 142 C50 142 50 62 100 62" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg></div>
<sc-if value="{{s.last}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 50%; height: 200px; overflow: visible"><path d="M0 142 L100 142" fill="none" stroke="#C3CDC3" stroke-width="48" vector-effect="non-scaling-stroke"></path><path d="M0 142 L100 142" fill="none" stroke="#E4E9E1" stroke-width="40" vector-effect="non-scaling-stroke"></path><path d="M0 142 L100 142" fill="none" stroke="#0E2219" stroke-width="3" stroke-dasharray="1 14" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg><span style="position: absolute; right: 0; top: 96px; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #0E2219"><svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><path d="M2 17V1M2 2h11l-3 4 3 4H2" fill="#C8F04A" stroke="#0E2219" stroke-width="1.75" stroke-linejoin="round"></path></svg>Licensed</span></sc-if>
<button type="button" onClick="{{s.select}}" aria-pressed="{{s.pressed}}" style="{{s.btnStyle}}">
<span style="{{s.hereStyle}}">You are here</span>
<span style="{{s.markerStyle}}">{{s.num}}</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -0.01em">{{s.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3D4F45">{{s.count}} resources</span>
</button>
</div>
</sc-for>
</div>
</div>
</div>

<div style="margin-top: 40px; background: #FFFFFF; border: 1px solid #D3DAD3; border-radius: 20px; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 300px; min-width: 0">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #3D4F45">Stop {{cur.num}} of 6</div>
<h3 style="margin: 10px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.025em">{{cur.name}}</h3>
<p style="margin: 12px 0 0; font-size: 18px; color: #3D4F45">{{cur.question}}</p>
<div style="margin-top: 28px; font-weight: 600">Start here</div>
<ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{cur.todo}}" as="t" hint-placeholder-count="4">
<li style="display: flex; gap: 12px; align-items: flex-start">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10" fill="#C8F04A" stroke="#0E2219" stroke-width="1.75"></circle><path d="M7.5 12.5 l3 3 l6 -7" fill="none" stroke="#0E2219" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span>{{t.text}}</span>
</li>
</sc-for>
</ul>
<button type="button" onClick="{{toggleAll}}" aria-expanded="{{cur.expandedAttr}}" style="margin-top: 32px; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; cursor: pointer; background: #0E2219; color: #FFFFFF; font-weight: 600; font-size: 16px">{{cur.moreLabel}}<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#C8F04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px">
<sc-for list="{{cur.cards}}" as="c" hint-placeholder-count="6">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 22px; background: #F1F3EE; border-radius: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; padding: 3px 9px; border: 1.5px solid #0E2219; border-radius: 999px">{{c.org}}</span>
<span style="font-size: 13px; color: #3D4F45">{{c.need}}</span>
</div>
<h4 style="margin: 2px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em">{{c.name}}</h4>
<p style="margin: 0; font-size: 15px; color: #3D4F45; flex-grow: 1">{{c.desc}}</p>
<div style="font-size: 13px; color: #3D4F45"><strong style="color: #0E2219; font-weight: 600">{{c.cost}}</strong> · {{c.timing}}</div>
<a href="{{c.url}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Visit {{c.org}}<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</article>
</sc-for>
</div>
</div>
</div>
</section>

<section id="labash" class="pp-section" style="padding: 80px 64px; background: #C8F04A; color: #0E2219">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end; justify-content: space-between">
<div style="flex: 1 1 520px; min-width: 0">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase">The annual gathering</div>
<h2 style="margin: 14px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 1.0; letter-spacing: -0.03em">Meet your people at LABash.</h2>
<p style="margin: 18px 0 0; max-width: 620px; font-size: 19px; line-height: 1.5">LABash is the annual conference for landscape architecture students, organized by students and hosted by a different school each year. Come for the talks and networking, and meet the people you will practice alongside.</p>
<p style="margin: 14px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 14px">Next LABash: [host school and dates]</p>
</div>
<a href="https://www.asla.org/awards-events-main-landing/conferences-events/labash" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 999px; background: #0E2219; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 17px">Learn about LABash<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#C8F04A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</div>
</section>

<section id="deadlines" class="pp-section" style="padding: 72px 64px; background: #0E2219; color: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.02em">Coming up</h2>
<button type="button" onClick="{{toggleDeadlines}}" aria-expanded="{{dlExpanded}}" style="min-height: 44px; padding: 0 4px; background: none; border: 0; cursor: pointer; color: #C8F04A; font-weight: 600; font-size: 16px; text-decoration: underline; text-underline-offset: 4px">{{dlLabel}}</button>
</div>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{deadlines}}" as="d" hint-placeholder-count="4">
<a href="{{d.url}}" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 10px; padding: 24px; border: 1px solid #3A5446; border-radius: 14px; color: #FFFFFF; text-decoration: none">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #C8F04A; letter-spacing: -0.02em">{{d.date}}</span>
<span style="font-weight: 600; font-size: 17px">{{d.title}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B9C7BE">{{d.org}} · {{d.stop}}</span>
</a>
</sc-for>
</div>
<div style="{{dlListStyle}}">
<h3 style="margin: 48px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">Next 12 months</h3>
<ul style="list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid #3A5446">
<sc-for list="{{deadlinesAll}}" as="d" hint-placeholder-count="12">
<li style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; padding: 16px 0; border-bottom: 1px solid #3A5446">
<span style="flex: 0 0 150px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #C8F04A">{{d.date}}</span>
<a href="{{d.url}}" target="_blank" rel="noopener" style="flex: 1 1 320px; min-width: 0; color: #FFFFFF; font-weight: 600; text-underline-offset: 3px">{{d.title}}</a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B9C7BE">{{d.org}} · {{d.stop}}</span>
</li>
</sc-for>
</ul>
</div>
</div>
</section>

<section id="needs" class="pp-section" style="padding: 88px 64px">
<div style="max-width: 1240px; margin: 0 auto">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.02em">Or browse by what you need</h2>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{needs}}" as="n" hint-placeholder-count="10">
<button type="button" onClick="{{n.select}}" aria-pressed="{{n.pressed}}" style="{{n.tileStyle}}">
<span>{{n.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500">{{n.count}}</span>
</button>
</sc-for>
</div>
<div style="{{needPanelStyle}}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.02em">{{needTitle}}</h3>
<button type="button" onClick="{{clearNeed}}" style="min-height: 44px; padding: 0 4px; background: none; border: 0; cursor: pointer; color: #0E2219; font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px">Close</button>
</div>
<ul style="list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid #D3DAD3">
<sc-for list="{{needResults}}" as="r" hint-placeholder-count="6">
<li style="display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 18px 0; border-bottom: 1px solid #D3DAD3">
<span style="flex: 0 0 72px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; padding: 3px 9px; border: 1.5px solid #0E2219; border-radius: 999px">{{r.org}}</span></span>
<div style="flex: 1 1 420px; min-width: 0">
<a href="{{r.url}}" target="_blank" rel="noopener" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; text-underline-offset: 3px">{{r.name}}</a>
<p style="margin: 4px 0 0; font-size: 15px; color: #3D4F45">{{r.desc}}</p>
</div>
<div style="flex: 0 1 260px; font-size: 13px; color: #3D4F45"><strong style="color: #0E2219; font-weight: 600">{{r.cost}}</strong> · {{r.timing}}<br>{{r.stops}}</div>
</li>
</sc-for>
</ul>
</div>
</div>
</section>

<section id="about" class="pp-section" style="padding: 72px 64px; background: #E3E8E1">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em">One path, built together</h2>
<p style="margin: 14px 0 0; color: #3D4F45">Path to Practice brings together programs from the organizations that educate, accredit, license, and support landscape architects. Every link goes straight to the organization that runs the program.</p>
</div>
<ul style="flex: 2 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
<sc-for list="{{orgs}}" as="o" hint-placeholder-count="6">
<li><a href="{{o.url}}" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; background: #F1F3EE; border-radius: 12px; text-decoration: none">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{o.short}}</span>
<span style="font-size: 14px; color: #3D4F45">{{o.full}}</span>
</a></li>
</sc-for>
</ul>
</div>
</section>

<footer class="pp-section" style="padding: 32px 64px; border-top: 1px solid #D3DAD3">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #3D4F45">
<span>Path to Practice · A LABash resource · One place. Every step.</span>
